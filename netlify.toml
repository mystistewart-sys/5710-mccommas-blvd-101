# Netlify configuration — 5710 McCommas Blvd #101
# Static site. One build step stamps asset URLs. Concierge under /.netlify/functions/.

[build]
  publish = "public"
  # Fingerprints the CSS/JS references in the HTML so a deploy always invalidates
  # the browser cache for changed assets, and never for unchanged ones.
  command = "node tools/stamp-assets.mjs"
  # data/ and docs/ stay in the repo but are deliberately outside `publish`
  # so internal working notes are never served.

[functions]
  directory      = "netlify/functions"
  node_bundler   = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options  = "nosniff"
    X-Frame-Options         = "SAMEORIGIN"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
